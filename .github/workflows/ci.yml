name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Audit casks
        run: |
          for cask in Casks/*.rb; do
            brew audit --cask "$(basename "$cask" .rb)"
          done
