name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Tap local repo
        run: brew tap joaodrp/tap .
      # Homebrew refuses to load casks from a third-party tap until the tap
      # is trusted, which fails the audit below.
      - name: Trust the tap
        run: brew trust joaodrp/tap
      - name: Audit formulae
        run: |
          for formula in Formula/*.rb; do
            brew audit --formula "$(basename "$formula" .rb)"
          done
      - name: Audit casks
        run: |
          for cask in Casks/*.rb; do
            brew audit --cask "$(basename "$cask" .rb)"
          done
